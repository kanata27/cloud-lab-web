    <main class="login-main">

      <section
        class="login-card"
        aria-labelledby="login-title"
      >

        <div
          class="lock-mark"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <rect
              x="5"
              y="10"
              width="14"
              height="11"
              rx="3"
            />

            <path
              d="M8 10V7a4 4 0 018 0v3M12 14v3"
            />
          </svg>
        </div>


        <p class="eyebrow">
          kanata / statpanel
        </p>

        <h1 id="login-title">
          Вход в панель
        </h1>


        <form
          id="login-form"
          class="login-form"
          method="post"
        >

          <label class="field">

            <span class="field-label">
              Логин
            </span>

            <input
              id="username"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              placeholder="Имя пользователя"
              maxlength="128"
              required
            >

          </label>


          <div class="field">

            <label
              class="field-label"
              for="password"
            >
              Пароль
            </label>

            <div class="password-wrap">

              <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Введи пароль"
                maxlength="256"
                required
              >

              <button
                id="show-password"
                class="show-password"
                type="button"
                aria-controls="password"
                aria-pressed="false"
              >
                Показать
              </button>

            </div>

          </div>


          <button
            id="submit-login"
            class="submit-button"
            type="submit"
            disabled
          >
            Войти
          </button>


          <p
            id="login-status"
            class="login-status"
            role="status"
            hidden
          ></p>

        </form>

      </section>

    </main>

  </div>


  <script src="/site-config.js"></script>
