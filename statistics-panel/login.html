  <meta charset="utf-8">

  <title>kanata · вход в панель</title>
  <style>
    :root { color-scheme:light dark; --bg:#eeece7; --surface:#faf9f6; --ink:#242724; --muted:#676a65; --line:#d9dbd3; --accent:#557665; --accent-soft:#e7ede8; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input { font:inherit; }
    a { color:inherit; }
    button,input,a { -webkit-tap-highlight-color:transparent; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
    [hidden] { display:none!important; }
    h1,p { margin:0; }
    .login-shell { width:min(1160px,100%); min-height:100svh; padding:34px 32px 24px; margin:auto; display:flex; flex-direction:column; }
    .masthead { display:flex; align-items:center; gap:24px; padding-bottom:27px; border-bottom:1px solid var(--line); }
    .wordmark { display:block; line-height:0; }
    .wordmark img { width:148px; height:auto; max-width:100%; }
    .private-label { color:var(--muted); font-size:13px; letter-spacing:.03em; }
    .login-main { flex:1; display:grid; place-items:center; padding:52px 0; }
    .login-card { width:min(440px,100%); padding:36px; border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:0 8px 36px #23292008; }
    .lock-mark { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; color:var(--accent); background:var(--accent-soft); margin-bottom:25px; }
    .eyebrow { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.17em; margin-bottom:9px; }
    h1 { font-size:34px; font-weight:500; line-height:1.15; letter-spacing:-.04em; margin-bottom:12px; }
    .intro { color:var(--muted); font-size:14px; margin-bottom:30px; }
    .login-form { display:grid; gap:19px; }
    .field { display:grid; gap:7px; }
    .field-label { font-size:13px; font-weight:500; }
    input { width:100%; min-width:0; min-height:50px; padding:12px 14px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); font-size:16px; }
    input::placeholder { color:var(--muted); opacity:.8; }
    .password-wrap { position:relative; }
    .password-wrap input { padding-right:102px; }
    .show-password { display:flex; align-items:center; justify-content:center; position:absolute; top:3px; bottom:3px; right:4px; min-width:90px; padding:6px 9px; background:transparent; color:var(--muted); border:0; border-radius:6px; font-size:12px; cursor:pointer; }
    .submit-button { min-height:50px; padding:12px 18px; margin-top:5px; border:0; border-radius:9px; background:var(--ink); color:var(--surface); font-weight:600; cursor:pointer; }
    .submit-button:disabled { opacity:.5; cursor:default; }
    .submit-button:hover:not(:disabled) { filter:brightness(.9); }
    .login-status { padding:12px; border-radius:8px; background:var(--accent-soft); font-size:13px; }
    .preview-note { margin-top:22px; padding-top:20px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); line-height:1.7; }
    .preview-link { margin-top:10px; display:inline-flex; align-items:center; min-height:44px; gap:8px; color:var(--ink); text-underline-offset:4px; font-size:13px; }
    .login-footer { text-align:center; font-size:12px; color:var(--muted); }
    @media(prefers-color-scheme:dark) {
      :root { --bg:#1d201f; --surface:#252927; --ink:#eceee7; --muted:#adb4ad; --line:#404742; --accent:#99bba5; --accent-soft:#2a3b32; }
      .wordmark img { filter:invert(1); }
      .login-card { box-shadow:none; }
    }
    @media(max-width:760px) {
      .login-shell { padding:24px max(18px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left)); }
      .masthead { gap:18px; padding-bottom:22px; }
      .wordmark img { width:118px; }
      .private-label { font-size:12px; }
      .login-main { padding:30px 0; }
      .login-card { padding:28px 24px; border-radius:14px; }
      h1 { font-size:30px; }
      .lock-mark { margin-bottom:22px; }
    }
    @media(max-width:380px) {
      .login-shell { padding-left:max(14px,env(safe-area-inset-left)); padding-right:max(14px,env(safe-area-inset-right)); }
      .login-card { padding:24px 20px; }
      .masthead { gap:14px; }
      h1 { font-size:29px; }
    }
    @media(max-height:650px) { .login-main { padding-top:24px; padding-bottom:24px; } }
  </style>
</head>

    <main class="login-main">
      <section class="login-card" aria-labelledby="login-title">
        <div class="lock-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 018 0v3M12 14v3"/></svg></div>
        <p class="eyebrow">kanata / statpanel</p>
        <h1 id="login-title">Вход в панель</h1>
        <p class="intro">Статистика твоего сайта.</p>
        <form id="login-form" class="login-form" method="post" aria-describedby="preview-note">
          <label class="field"><span class="field-label">Логин</span><input id="username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Имя пользователя" maxlength="128"></label>
          <div class="field"><label class="field-label" for="password">Пароль</label><div class="password-wrap"><input id="password" type="password" autocomplete="off" placeholder="Введи пароль" maxlength="256"><button id="show-password" class="show-password" type="button" aria-controls="password" aria-pressed="false">Показать</button></div></div>
          <button id="submit-login" class="submit-button" type="submit" disabled>Войти</button>
          <p id="login-status" class="login-status" role="status" hidden></p>
        </form>
        <p id="preview-note" class="preview-note">Макет экрана входа. Авторизация ещё не подключена; пароль вводить не нужно.</p>
        <a class="preview-link" href="./kanata-stats-preview-v1.html">Открыть демо панели <span aria-hidden="true">→</span></a>
      </section>
    </main>
    <footer class="login-footer">kanata · личная панель</footer>
  </div>
  <script>
    "use strict";
    const passwordInput = document.getElementById("password");
    const toggle = document.getElementById("show-password");
    
    toggle.addEventListener("click", () => {
      const visible = passwordInput.type === "password";
      passwordInput.type = visible ? "text" : "password";
      toggle.textContent = visible ? "Скрыть" : "Показать";
      toggle.setAttribute("aria-pressed", String(visible));
    });

    document.getElementById("login-form").addEventListener("submit", event => {
      event.preventDefault();
      // Сохраняем пароль в память браузера (localStorage)
      localStorage.setItem("kanata_admin_key", passwordInput.value);
      
      // Перекидываем в саму панель статистики
      window.location.href = "./index.html";
    });
    
    document.getElementById("submit-login").disabled = false;
    window.addEventListener("pagehide", () => { passwordInput.value = ""; });
  </script>
