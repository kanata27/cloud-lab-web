<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="robots"
    content="noindex, nofollow, noarchive"
  >

  <meta
    name="referrer"
    content="no-referrer"
  >

  <meta
    name="color-scheme"
    content="light dark"
  >

  <title>kanata · вход в панель</title>

  <style>
    :root {
      color-scheme: light dark;

      --bg: #eeece7;
      --surface: #faf9f6;
      --ink: #242724;
      --muted: #676a65;
      --line: #d9dbd3;
      --accent: #557665;
      --accent-soft: #e7ede8;
      --error: #8d332a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font:
        15px/1.5
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
    }

    button,
    input,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    [hidden] {
      display: none !important;
    }

    h1,
    p {
      margin: 0;
    }

    .login-shell {
      width: min(1160px, 100%);
      min-height: 100svh;
      padding: 34px 32px 24px;
      margin: auto;

      display: flex;
      flex-direction: column;
    }

    .masthead {
      display: flex;
      align-items: center;
      gap: 24px;

      padding-bottom: 27px;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      display: block;
      line-height: 0;
    }

    .wordmark img {
      width: 148px;
      height: auto;
      max-width: 100%;
    }

    .private-label {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .03em;
    }

    .login-main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 52px 0;
    }

    .login-card {
      width: min(440px, 100%);
      padding: 36px;

      border: 1px solid var(--line);
      border-radius: 16px;

      background: var(--surface);

      box-shadow:
        0 8px 36px #23292008;
    }

    .lock-mark {
      width: 44px;
      height: 44px;

      border-radius: 12px;

      display: grid;
      place-items: center;

      color: var(--accent);
      background: var(--accent-soft);

      margin-bottom: 25px;
    }

    .eyebrow {
      font-size: 11px;
      color: var(--muted);

      text-transform: uppercase;
      letter-spacing: .17em;

      margin-bottom: 9px;
    }

    h1 {
      font-size: 34px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -.04em;

      margin-bottom: 30px;
    }

    .login-form {
      display: grid;
      gap: 19px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 500;
    }

    input {
      width: 100%;
      min-width: 0;
      min-height: 50px;

      padding: 12px 14px;

      border: 1px solid var(--line);
      border-radius: 9px;

      background: var(--surface);
      color: var(--ink);

      font-size: 16px;
    }

    input::placeholder {
      color: var(--muted);
      opacity: .8;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 102px;
    }

    .show-password {
      display: flex;
      align-items: center;
      justify-content: center;

      position: absolute;
      top: 3px;
      bottom: 3px;
      right: 4px;

      min-width: 90px;

      padding: 6px 9px;

      background: transparent;
      color: var(--muted);

      border: 0;
      border-radius: 6px;

      font-size: 12px;
      cursor: pointer;
    }

    .submit-button {
      min-height: 50px;

      padding: 12px 18px;
      margin-top: 5px;

      border: 0;
      border-radius: 9px;

      background: var(--ink);
      color: var(--surface);

      font-weight: 600;
      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: .5;
      cursor: default;
    }

    .submit-button:hover:not(:disabled) {
      filter: brightness(.9);
    }

    .login-status {
      padding: 12px;

      border-radius: 8px;

      background: var(--accent-soft);

      font-size: 13px;
    }

    .login-status[data-error="true"] {
      color: var(--error);
      background: var(--surface);
      border: 1px solid var(--error);
    }

    .login-footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d201f;
        --surface: #252927;
        --ink: #eceee7;
        --muted: #adb4ad;
        --line: #404742;
        --accent: #99bba5;
        --accent-soft: #2a3b32;
        --error: #ffa59b;
      }

      .wordmark img {
        filter: invert(1);
      }

      .login-card {
        box-shadow: none;
      }
    }

    @media (max-width: 760px) {
      .login-shell {
        padding:
          24px
          max(18px, env(safe-area-inset-right))
          max(22px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
      }

      .masthead {
        gap: 18px;
        padding-bottom: 22px;
      }

      .wordmark img {
        width: 118px;
      }

      .private-label {
        font-size: 12px;
      }

      .login-main {
        padding: 30px 0;
      }

      .login-card {
        padding: 28px 24px;
        border-radius: 14px;
      }

      h1 {
        font-size: 30px;
      }

      .lock-mark {
        margin-bottom: 22px;
      }
    }

    @media (max-width: 380px) {
      .login-shell {
        padding-left:
          max(14px, env(safe-area-inset-left));

        padding-right:
          max(14px, env(safe-area-inset-right));
      }

      .login-card {
        padding: 24px 20px;
      }

      .masthead {
        gap: 14px;
      }

      h1 {
        font-size: 29px;
      }
    }

    @media (max-height: 650px) {
      .login-main {
        padding-top: 24px;
        padding-bottom: 24px;
      }
    }
  </style>
</head>

<body>

          alt="kanata"
          width="188"
          height="50"
        >
      </a>

      <span class="private-label">
        Панель статистики
      </span>

    </header>


    <main class="login-main">

      <section
        class="login-card"
        aria-labelledby="login-title"
      >

        <div
          class="lock-mark"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <rect
              x="5"
              y="10"
              width="14"
              height="11"
              rx="3"
            />

            <path
              d="M8 10V7a4 4 0 018 0v3M12 14v3"
            />
          </svg>
        </div>


        <p class="eyebrow">
          kanata / statpanel
        </p>

        <h1 id="login-title">
          Вход в панель
        </h1>


        <form
          id="login-form"
          class="login-form"
          method="post"
        >

          <label class="field">

            <span class="field-label">
              Логин
            </span>

            <input
              id="username"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              placeholder="Имя пользователя"
              maxlength="128"
              required
            >

          </label>


          <div class="field">

            <label
              class="field-label"
              for="password"
            >
              Пароль
            </label>

            <div class="password-wrap">

              <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Введи пароль"
                maxlength="256"
                required
              >

              <button
                id="show-password"
                class="show-password"
                type="button"
                aria-controls="password"
                aria-pressed="false"
              >
                Показать
              </button>

            </div>

          </div>


          <button
            id="submit-login"
            class="submit-button"
            type="submit"
            disabled
          >
            Войти
          </button>


          <p
            id="login-status"
            class="login-status"
            role="status"
            hidden
          ></p>

        </form>

      </section>

    </main>

  </div>


  <script>
    "use strict";

    const API_BASE =
      "https://dupt8l46y1.execute-api.eu-north-1.amazonaws.com";


    const usernameInput =
      document.getElementById("username");

    const passwordInput =
      document.getElementById("password");

    const submitButton =
      document.getElementById("submit-login");

    const statusElement =
      document.getElementById("login-status");

    const toggleButton =
      document.getElementById("show-password");


    function updateSubmitState() {
      submitButton.disabled =
        !usernameInput.value.trim()
        || !passwordInput.value;
    }


    function showError(message) {
      statusElement.textContent = message;
      statusElement.dataset.error = "true";
      statusElement.hidden = false;
    }


    function clearStatus() {
      statusElement.textContent = "";
      statusElement.hidden = true;
      statusElement.dataset.error = "false";
    }


    usernameInput.addEventListener(
      "input",
      updateSubmitState
    );


    passwordInput.addEventListener(
      "input",
      updateSubmitState
    );


    toggleButton.addEventListener(
      "click",
      () => {

        const visible =
          passwordInput.type === "password";

        passwordInput.type =
          visible
            ? "text"
            : "password";

        toggleButton.textContent =
          visible
            ? "Скрыть"
            : "Показать";

        toggleButton.setAttribute(
          "aria-pressed",
          String(visible)
        );

        passwordInput.focus();
      }
    );


    document
      .getElementById("login-form")
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();

          if (
            !usernameInput.value.trim()
            || !passwordInput.value
          ) {
            updateSubmitState();
            return;
          }

          clearStatus();

          submitButton.disabled = true;
          submitButton.textContent = "Входим…";


          try {

            const response = await fetch(
              `${API_BASE}/login`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  username:
                    usernameInput.value.trim(),

                  password:
                    passwordInput.value
                })
              }
            );


            if (response.status === 401) {
              throw new Error(
                "Неверный логин или пароль."
              );
            }


            if (!response.ok) {
              throw new Error(
                "Ошибка сервера. Попробуй ещё раз."
              );
            }


            const data =
              await response.json();


            if (!data.token) {
              throw new Error(
                "Сервер не вернул токен сессии."
              );
            }


            sessionStorage.setItem(
              "kanata_admin_token",
              data.token
            );


            passwordInput.value = "";


            window.location.replace(
              "./index.html"
            );

          } catch (error) {

            showError(
              error.message
              || "Не удалось войти."
            );

          } finally {

            submitButton.textContent =
              "Войти";

            updateSubmitState();
          }
        }
      );


    updateSubmitState();


    window.addEventListener(
      "pagehide",
      () => {
        passwordInput.value = "";
      }
    );
  </script>

</body>
</html>
