<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Kanata — guitar, music and social links."
  >

  <title>Kanata's links</title>

  <!-- Tab icon and iPhone home-screen icon -->
  <link rel="icon" href="/assets/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180">

  <!-- Sharing preview. After connecting a domain, replace the ALB origin below. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="kanata">
  <meta property="og:title" content="Kanata's links">
  <meta property="og:description" content="Guitar covers. YouTube &amp; Instagram.">
  <meta property="og:url" content="http://cloud-lab-alb-963312302.eu-north-1.elb.amazonaws.com/">
  <meta property="og:image" content="http://cloud-lab-alb-963312302.eu-north-1.elb.amazonaws.com/assets/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="kanata wordmark beside a full-length photo of a guitarist with a white electric guitar.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kanata's links">
  <meta name="twitter:description" content="Guitar covers. YouTube &amp; Instagram.">
  <meta name="twitter:image" content="http://cloud-lab-alb-963312302.eu-north-1.elb.amazonaws.com/assets/og-image.jpg">
  <meta name="twitter:image:alt" content="kanata wordmark beside a guitarist with a white electric guitar.">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/style.css?v=2">
</head>

<body>

  <main class="page-shell">

    <section class="hero">

      <div class="brand-wrap">
        <img
          class="brand-logo"
          src="/assets/kanata-logo.svg"
          alt="kanata"
        >
      </div>

      <article class="profile-card">

        <div class="photo-frame">
          <img
            class="profile-photo"
            src="/assets/hero.webp"
            width="1120"
            height="1399"
            fetchpriority="high"
            alt="Guitarist playing a white electric guitar"
          >
        </div>

        <nav class="social-list">

          <a
            class="social-link"
            href="https://www.youtube.com/@kanataguitar"
            target="_blank"
            rel="noreferrer"
          >

            <span class="social-icon youtube-icon">
              <svg
                viewBox="0 0 64 44"
                aria-hidden="true"
              >
                <rect
                  x="0"
                  y="0"
                  width="64"
                  height="44"
                  rx="12"
                ></rect>

                <path
                  d="M27 13.5 43 22 27 30.5Z"
                  fill="white"
                ></path>
              </svg>
            </span>

            <span class="social-name">
              YouTube
            </span>

            <span class="arrow">
              →
            </span>

          </a>


          <a
            class="social-link"
            href="https://www.instagram.com/kanatavii/"
            target="_blank"
            rel="noreferrer"
          >

            <span class="social-icon instagram-icon">

              <svg
                viewBox="0 0 48 48"
                aria-hidden="true"
              >

                <rect
                  x="5"
                  y="5"
                  width="38"
                  height="38"
                  rx="11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="5"
                ></rect>

                <circle
                  cx="24"
                  cy="24"
                  r="9"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="5"
                ></circle>

                <circle
                  cx="35.5"
                  cy="12.5"
                  r="2.8"
                ></circle>

              </svg>

            </span>

            <span class="social-name">
              Instagram
            </span>

            <span class="arrow">
              →
            </span>

          </a>

        </nav>

      </article>

    </section>

  </main>

</body>
</html>
