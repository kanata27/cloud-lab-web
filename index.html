<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kanata — guitar, music and social links.">
  <title>Kanata</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-labelledby="site-title">
      <div class="brand-wrap">
        <h1 id="site-title" class="brand">kanata</h1>
      </div>

      <article class="profile-card" aria-label="Kanata social links">
        <div class="photo-frame">
          <img
            class="profile-photo"
            src="/assets/hero.jpg"
            alt="Guitarist playing a white electric guitar"
          >
        </div>

        <nav class="social-list" aria-label="Social links">
          <a class="social-link" href="https://www.youtube.com/" target="_blank" rel="noreferrer">
            <span class="social-icon" aria-hidden="true">
              <svg viewBox="0 0 64 44" role="img">
                <rect x="0" y="0" width="64" height="44" rx="12"></rect>
                <path d="M27 13.5 43 22 27 30.5Z" fill="white"></path>
              </svg>
            </span>
            <span class="social-name">YouTube</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>

          <a class="social-link" href="https://www.instagram.com/" target="_blank" rel="noreferrer">
            <span class="social-icon instagram-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" role="img">
                <rect x="5" y="5" width="38" height="38" rx="11" fill="none" stroke="currentColor" stroke-width="5"></rect>
                <circle cx="24" cy="24" r="9" fill="none" stroke="currentColor" stroke-width="5"></circle>
                <circle cx="35.5" cy="12.5" r="2.8"></circle>
              </svg>
            </span>
            <span class="social-name">Instagram</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </nav>
      </article>
    </section>
  </main>
</body>
</html>
