name: Cloudflare site

on:
  pull_request:
    branches: [main]

  push:
    branches: [main, 'feature/**']

  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy (production connects the real domain)"
        type: choice
        options: [preview, production]
        default: preview
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  deploy:
    needs: check
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'preview') ||
      (github.ref == 'refs/heads/main' &&
       (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && vars.CLOUDFLARE_PRODUCTION_ENABLED == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/') && 'preview') || inputs.target || 'production' }}
    concurrency:
      group: cloudflare-${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/') && 'preview') || inputs.target || 'production' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/') && 'preview') || inputs.target || 'production' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Reject an outdated branch revision
        shell: bash
        run: |
          latest_revision=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$latest_revision" = "$GITHUB_SHA" || { echo 'The branch changed during checks. Deploy the latest commit.'; exit 1; }
      - name: Validate deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          case "$TARGET" in preview|production) ;; *) exit 1 ;; esac
      - name: Inspect DNS and save rollback settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/dns-preflight.mjs "$TARGET"
      - name: Keep DNS rollback snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dns-before-${{ env.TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dns-before-*.json
          retention-days: 30
          if-no-files-found: error
      - name: Migrate earnings database and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # In CI Wrangler updates the listed custom-domain DNS records itself.
        # Feature pushes deploy preview after checks. Production keeps its existing gate.
        run: npm run "deploy:$TARGET"
      - name: Check deployed public routes
        run: node tools/smoke.mjs "$TARGET"
